<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A006E" />
      <stop offset="100%" stop-color="#050038" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#navyBg)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldAccent)" stroke-width="12" opacity="0.9" />

  <!-- Wine / Spirits Goblet Emblem in Safe Zone -->
  <g transform="translate(256, 232)">
    <!-- Outer Halo -->
    <circle cx="0" cy="-10" r="130" fill="#FFDE00" opacity="0.08" />
    <!-- Wine Glass Bowl -->
    <path
      d="M-68,-110 L68,-110 L56,-25 C50,22 25,48 0,48 C-25,48 -50,22 -56,-25 Z"
      fill="none"
      stroke="url(#goldAccent)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Liquid Level inside Glass -->
    <path
      d="M-50,-42 Q0,-26 50,-42 L46,-22 C41,14 20,34 0,34 C-20,34 -41,14 -46,-22 Z"
      fill="url(#goldAccent)"
    />
    <!-- Stem -->
    <line x1="0" y1="48" x2="0" y2="116" stroke="url(#goldAccent)" stroke-width="22" stroke-linecap="round" />
    <!-- Base -->
    <line x1="-54" y1="116" x2="54" y2="116" stroke="url(#goldAccent)" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Brand Title -->
  <text
    x="256"
    y="436"
    text-anchor="middle"
    font-family="Montserrat, Arial, sans-serif"
    font-weight="900"
    font-style="italic"
    font-size="62"
    letter-spacing="2"
    fill="#FFFFFF"
  >
    VAAIRO
  </text>
</svg>
