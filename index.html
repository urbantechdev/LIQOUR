    <script>
      (function () {
        function isExtConnErr(val) {
          var s = typeof val === 'string' ? val : (val && (val.message || val.stack || String(val))) || '';
          return typeof s === 'string' && (
            s.indexOf('Could not establish connection') !== -1 ||
            s.indexOf('Receiving end does not exist') !== -1 ||
            s.indexOf('chrome.runtime.sendMessage') !== -1 ||
            s.indexOf('sendMessage timed out') !== -1 ||
            s.indexOf('Extension context invalidated') !== -1 ||
            s.indexOf('message port closed') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('vite-pwa-plugin:dev-ready') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function (event) {
          if (event && isExtConnErr(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (event) {
          if (
            event && (
              isExtConnErr(event.message) ||
              isExtConnErr(event.error) ||
              isExtConnErr(event.filename)
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        var origOnError = window.onerror;
        window.onerror = function (msg, url, line, col, error) {
          if (isExtConnErr(msg) || isExtConnErr(url) || isExtConnErr(error)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isExtConnErr(arguments[i])) return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
